<!DOCTYPE html>
<html>
<head>
    <title>Create First Admin</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
</head>
<body>
    <h2>Create First Administrator</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="createAdmin()">Create Admin</button>

    <script>
        // Initialize Firebase
        firebase.initializeApp({
            apiKey: "AIzaSyCLuF-4Fv-6cH7G6ZqcUSigJWzVtPSMLFs",
  authDomain: "weborchestrator-dc5c6.firebaseapp.com",
  projectId: "weborchestrator-dc5c6",
  storageBucket: "weborchestrator-dc5c6.firebasestorage.app",
  messagingSenderId: "787679558742",
  appId: "1:787679558742:web:14ffe1cba424be8ca1cff7",
  measurementId: "G-81XKJR2DD9"
});

        async function createAdmin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Create user
                const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);

                // You'll need to use Admin SDK to set custom claims
                alert('User created! Now use Firebase Console or Admin SDK to set admin claims.');

                // Redirect to Firebase Console instructions
                window.open('https://console.firebase.google.com/project/_/authentication/users', '_blank');

            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
