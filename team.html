<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    overflow: auto;
}

/* Background */
.container {
    height: 100vh;
    width: 100%;
    background: url("./assets/img/team4.webp") center/cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* Overlay */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.65);
}

/* Back Home Button */
.back-home {
    position: absolute;
    top: 25px;
    right: 30px;
    z-index: 5;
    padding: 10px 18px;
    border-radius: 30px;
    background: linear-gradient(45deg,#00f2ff,#0066ff);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    transition: .3s;
}
.back-home:hover {
    transform: scale(1.08);
}

/* Title */
/* Title Wrapper */
.team-title-wrapper {
    position: absolute;
    top: 70%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 3;
}

/* Main Title */
.team-title {
    font-size: 36px;
    font-weight: 700;
    color: #fff;
    opacity: 0;
    transform: translateY(30px);
    animation: slideUpTitle 1s ease forwards;
}

/* Subtitle */
.team-subtitle {
    margin-top: 10px;
    font-size: 15px;
    color: rgba(255,255,255,0.75);
    max-width: 600px;
    line-height: 1.6;
    opacity: 0;
    transform: translateY(30px);
    animation: slideUpSubtitle 1s ease forwards;
    animation-delay: .3s;
}

/* Animations */
@keyframes slideUpTitle {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes slideUpSubtitle {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive */
@media(max-width:1000px) {
    .team-title-wrapper {
        top: 65%;
        padding: 0 20px;
    }

    .team-title {
        font-size: 26px;
    }

    .team-subtitle {
        font-size: 14px;
    }
}


@keyframes slideUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Cards Wrapper */
.team {
    position: relative;
    display: flex;
    gap: 18px;
    z-index: 2;
    align-items: flex-end;
}

/* Card */
.card {
    width: 150px;
    padding: 20px;
    text-align: center;
    border-radius: 15px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    color: white;
    transform:
        translateX(calc(var(--i) * -6px))
        scale(calc(1 - (abs(var(--i)) * 0.12)));
    opacity: 0;
    transition: transform .6s ease, opacity .6s ease;
}

/* Center card highlight */
.card[data-center="true"] {
    transform: scale(1.15);
    background: rgba(255,255,255,0.12);
}

/* Animation trigger */
.card.show {
    opacity: 1;
}

/* Text */
.card h3 {
    margin-top: 10px;
    font-size: 16px;
}

.card p {
    font-size: 13px;
    opacity: .7;
}

    .team::before,
.team::after {
    content: "";
    flex: 0 0 15vw;
}






/* Mobile horizontal scroll only */
@media (max-width: 768px) {

    .team {
        flex-wrap: nowrap;
        overflow-x: auto;
        overflow-y: hidden;
        justify-content: flex-start;
        padding: 20px;
        gap: 16px;
        -webkit-overflow-scrolling: touch;
    }

    .card {
        flex: 0 0 auto;
    }

    .team::-webkit-scrollbar {
        display: none;
    }

    .team-title-wrapper {
      width: 100%;
      max-width: 90%;
      margin: 0 auto;
      text-align: center;
      left: 50%;
      transform: translateX(-50%);
  }

  .team-title {
      text-align: center;
      line-height: 1.2;
  }

  .team-subtitle {
      text-align: center;
      margin-top: 10px;
      line-height: 1.6;
  }
}

h3 {
  color: #a867d9;
}

/* HARD STOP horizontal scroll on large screens */
@media (min-width: 769px) {
    html, body {
        overflow-x: hidden;
    }

    .container {
        overflow-x: hidden;
    }

    .team {
        overflow-x: hidden !important;
        max-width: 100%;
    }
}

<script>
const cards = document.querySelectorAll(".card");

cards.forEach(card => {
    setTimeout(() => {
        card.classList.add("show");
    }, 300 + Math.abs(card.style.getPropertyValue("--i")) * 200);
});

if (window.innerWidth <= 768) {
    const team = document.querySelector('.team');
    const leaderCard = document.querySelector('.card[data-center="true"]');

    if (team && leaderCard) {
        const teamRect = team.getBoundingClientRect();
        const cardRect = leaderCard.getBoundingClientRect();

        team.scrollLeft =
            leaderCard.offsetLeft -
            (team.clientWidth / 2) +
            (leaderCard.clientWidth / 2);
    }
}
</script>
