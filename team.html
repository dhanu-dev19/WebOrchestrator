<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{overflow:auto}.container{height:100vh;width:100%;background:url("./assets/img/team4.webp") center/cover no-repeat;display:flex;justify-content:center;align-items:center;position:relative}.overlay{position:absolute;inset:0;background:rgba(0,0,0,.65)}.back-home{position:absolute;top:25px;right:30px;z-index:5;padding:10px 18px;border-radius:30px;background:linear-gradient(45deg,#00f2ff,#06f);color:#fff;text-decoration:none;font-size:14px;transition:.3s}.back-home:hover{transform:scale(1.08)}.team-title-wrapper{position:absolute;top:70%;left:50%;transform:translateX(-50%);text-align:center;z-index:3}.team-subtitle,.team-title{transform:translateY(30px);opacity:0}.team-title{font-size:36px;font-weight:700;color:#fff;animation:1s forwards slideUpTitle}.team-subtitle{margin-top:10px;font-size:15px;color:rgba(255,255,255,.75);max-width:600px;line-height:1.6;animation:1s .3s forwards slideUpSubtitle}@keyframes slideUpTitle{to{opacity:1;transform:translateY(0)}}@keyframes slideUpSubtitle{to{opacity:1;transform:translateY(0)}}@media(max-width:1000px){.team-title-wrapper{top:65%;padding:0 20px}.team-title{font-size:26px}.team-subtitle{font-size:14px}}@keyframes slideUp{to{opacity:1;transform:translateY(0)}}.team{position:relative;display:flex;gap:18px;z-index:2;align-items:flex-end}.card{width:150px;padding:20px;text-align:center;border-radius:15px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);color:#fff;transform:translateX(calc(var(--i) * -6px)) scale(calc(1 - (abs(var(--i)) * .12)));opacity:0;transition:transform .6s,opacity .6s}.card[data-center=true]{transform:scale(1.15);background:rgba(255,255,255,.12)}.card.show{opacity:1}.card h3{margin-top:10px;font-size:16px}.card p{font-size:13px;opacity:.7}.team::after,.team::before{content:"";flex:0 0 15vw}@media (max-width:768px){.team{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;padding:20px;gap:16px;-webkit-overflow-scrolling:touch}.card{flex:0 0 auto}.team::-webkit-scrollbar{display:none}.team-title-wrapper{width:100%;max-width:90%;margin:0 auto;text-align:center;left:50%;transform:translateX(-50%)}.team-title{text-align:center;line-height:1.2}.team-subtitle{text-align:center;margin-top:10px;line-height:1.6}}h3{color:#a867d9}@media (min-width:769px){.container,body,html{overflow-x:hidden}.team{overflow-x:hidden!important;max-width:100%}}

</style>

    <div class="team-title-wrapper">

    display:inline;

    background-size:300% 300%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: shineRotate 2.5s linear infinite;
    padding:0;
    margin:0;
  ">O</span></h1>
  <style>
@keyframes shineRotate {
  0%   { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}
</style>
    <p class="team-subtitle">
        A passionate group of designers, developers, and innovators shaping digital excellence.
    </p>
</div>

<script>
const cards=document.querySelectorAll(".card");if(cards.forEach((e=>{setTimeout((()=>{e.classList.add("show")}),300+200*Math.abs(e.style.getPropertyValue("--i")))})),window.innerWidth<=768){const e=document.querySelector(".team"),t=document.querySelector('.card[data-center="true"]');if(e&&t){e.getBoundingClientRect(),t.getBoundingClientRect();e.scrollLeft=t.offsetLeft-e.clientWidth/2+t.clientWidth/2}}
</script>
