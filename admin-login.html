<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .login-body {
            padding: 40px;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            width: 100%;
            transition: transform 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            color: white;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="login-card">
                    <div class="login-header">
                        <h2><i class="fas fa-lock me-2"></i>Admin Portal</h2>
                        <p class="mb-0">Sign in to access dashboard</p>
                    </div>
                    <div class="login-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="mb-3">
                                <div class="error-message" id="errorMessage">
                                    Invalid credentials. Please try again.
                                </div>
                            </div>
                            <button type="submit" class="btn-login" id="loginBtn">
                                <span id="btnText">Sign In</span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm" role="status" style="display: none;"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <script>
        // Your Firebase config
        const firebaseConfig = {
          apiKey: "AIzaSyCLuF-4Fv-6cH7G6ZqcUSigJWzVtPSMLFs",
  authDomain: "weborchestrator-dc5c6.firebaseapp.com",
  projectId: "weborchestrator-dc5c6",
  storageBucket: "weborchestrator-dc5c6.firebasestorage.app",
  messagingSenderId: "787679558742",
  appId: "1:787679558742:web:14ffe1cba424be8ca1cff7",
  measurementId: "G-81XKJR2DD9"
};

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // Show loading state
            btnText.style.display = 'none';
            btnSpinner.style.display = 'inline-block';
            loginBtn.disabled = true;
            errorMessage.style.display = 'none';

            try {
                // Sign in with email/password
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Get user token to check admin status
                const idTokenResult = await user.getIdTokenResult();

                if (idTokenResult.claims.admin) {
                    // Admin user, redirect to dashboard
                    localStorage.setItem('adminToken', idTokenResult.token);
                    window.location.href = 'admin-dashboard.html';
                } else {
                    // Not an admin
                    throw new Error('Not authorized as admin');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.style.display = 'block';
                btnText.style.display = 'inline-block';
                btnSpinner.style.display = 'none';
                loginBtn.disabled = false;
            }
        });

        // Check if already logged in
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const idTokenResult = await user.getIdTokenResult();
                    if (idTokenResult.claims.admin) {
                        window.location.href = 'admin-dashboard.html';
                    }
                } catch (error) {
                    console.error('Auth state error:', error);
                }
            }
        });
    </script>
</body>
</html>
